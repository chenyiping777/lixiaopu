<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>在线客服 · 栗小铺</title>
<link rel="stylesheet" href="chat.css"><script src="chat.js" defer></script></head>
<body data-admin="true"><main><header><a href="console.html">← 返回首页</a><h1>栗小铺 · 客服工作台</h1><p>管理员登录后连接客服。历史记录与清未读分开操作。</p></header>
<p id="status" role="status" aria-live="polite">尚未连接</p><div class="toolbar"><button id="connect">连接 / 重连</button><button id="refresh">刷新会话</button><span id="identity"></span></div>
<div class="layout"><aside><h2>最近会话</h2><div id="sessions"></div></aside><section><form id="open"><label>联系人 ID <input id="contact" inputmode="numeric" pattern="[1-9][0-9]*" required placeholder="客服或买家账号 ID"></label><button>打开会话</button></form>
<div class="toolbar"><button id="older" disabled>更早的记录</button><button id="read" disabled>清除本会话未读数</button><span id="conversation">请选择联系人</span></div><ol id="messages" aria-live="polite"></ol>
<form id="send"><label for="content">消息内容</label><textarea id="content" maxlength="4000" rows="3" required placeholder="输入消息；图片或语音请填写资源地址"></textarea><div class="toolbar"><label>类型 <select id="type"><option value="0">文本</option><option value="1">图片地址</option><option value="2">商品卡片</option><option value="3">语音地址</option></select></label><label>商品 ID <input id="product" inputmode="numeric" pattern="[1-9][0-9]*" placeholder="可选"></label><button id="send-button" disabled>发送</button></div></form>
</section></div></main></body></html>
