<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理端 · 栗小铺</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#302d28;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 6%;background:#2f3e35;color:#fff;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px;letter-spacing:2px}header span{font-size:12px;color:#d0dccb}main{max-width:950px;margin:50px auto;padding:0 20px}h1{font-size:35px;margin:5px 0}p{color:#746d63}.eyebrow{color:#a45d36;font-size:12px;letter-spacing:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}.card{background:#fff;border:1px solid #e2ddd3;border-radius:12px;padding:25px}h2{font-size:18px;margin-top:0}label{display:block;margin:12px 0;color:#574f46;font-size:13px}input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d6cec2;border-radius:7px;font:inherit}button{border:0;border-radius:7px;background:#a45d36;color:#fff;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#272b29;color:#e8e6db;padding:18px;border-radius:8px;font:12px/1.6 Consolas,monospace}#status{min-height:2em}small{color:#817a70}.good{color:#42674b}.error{color:#aa4033}@media(max-width:700px){.grid{grid-template-columns:1fr}header{padding:16px 20px}main{margin:25px auto}}
</style></head>
<body><header><strong>栗小铺 · 管理端</strong><span>ADMIN / PORT 8082</span></header><main><div class="eyebrow">LIXIAOPU ADMIN</div><h1>管理从这里开始。</h1><p>独立于用户端启动。管理员必须同时拥有管理员类型和已启用的管理员角色。</p><div class="grid"><section class="card"><h2>管理员登录</h2><form id="login"><label>手机号<input name="phone" autocomplete="tel" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p id="status" role="status"></p></section><section class="card"><h2>当前身份</h2><p>登录成功后查询受保护的 <code>/api/admin/me</code>，确认管理员权限生效。</p><button id="me" type="button">查询当前管理员</button><pre id="output">等待请求。</pre><small>令牌仅保存在当前标签页，调试区不会显示令牌内容。</small></section></div></main>
<script>
'use strict';
let token=sessionStorage.getItem('lxp.admin.token')||'';
async function send(path,method='GET',body){const response=await fetch(path,{method,headers:{Accept:'application/json',...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const json=await response.json();if(!response.ok||json.code!==200)throw Error(json.message||'请求失败');return json.data}
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const data=await send('/api/admin/auth/login','POST',Object.fromEntries(new FormData(e.target)));if(!data?.token)throw Error('登录响应缺少 token');token=data.token;sessionStorage.setItem('lxp.admin.token',token);e.target.reset();document.querySelector('#status').textContent='登录成功，可查询当前身份。';document.querySelector('#status').className='good'}catch(error){document.querySelector('#status').textContent=error.message;document.querySelector('#status').className='error'}finally{button.disabled=false}});
document.querySelector('#me').addEventListener('click',async e=>{e.target.disabled=true;try{document.querySelector('#output').textContent=JSON.stringify(await send('/api/admin/me'),null,2)}catch(error){document.querySelector('#output').textContent=error.message}finally{e.target.disabled=false}});
</script></body></html>
