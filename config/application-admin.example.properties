# Copy to src/main/resources/application-admin.properties in a fresh checkout.
server.port=8082
spring.application.name=lixiaopu-admin
spring.datasource.url=jdbc:mysql://localhost:3306/lixiaopu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
lixiaopu.auth.jwt-secret=${LXP_JWT_SECRET:}
lixiaopu.auth.issuer=lixiaopu
lixiaopu.auth.access-ttl=15m
lixiaopu.auth.refresh-ttl=7d
lixiaopu.bootstrap.username=${LXP_BOOTSTRAP_USERNAME:}
lixiaopu.bootstrap.password=${LXP_BOOTSTRAP_PASSWORD:}
lixiaopu.bootstrap.phone=${LXP_BOOTSTRAP_PHONE:}
